  .skmw-btn-back:hover{background:#f3f4f6;color:#0A0A0A;}

  @media (max-width:680px){.skmw-sched-cols{flex-direction:column;align-items:stretch;}.skmw-sched-left,.skmw-sched-right{width:100%;}.skmw-sched-right{border-left:none;border-top:1.5px solid #f3f4f6;padding-left:0;padding-top:16px;}}

<body>
<div id="pagebar">
  <span>SKMW edit-mock</span>
  <span class="hint">стенд для разбора формы редактирования — код один в один из content.js</span>
  <button onclick="openScheduleMock()">📅 Schedule post</button>
  <button onclick="renderCalendar()">↺ Reopen popup</button>
</div>

<script>
// ==== helpers ported verbatim from content.js ====
const BRAND = '#FF90E8', INK = '#0A0A0A';
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toDtLocal(d){const p=(n)=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function atDayOffset(days,h,m){const d=new Date();d.setDate(d.getDate()+days);d.setHours(h,m,0,0);return d;}
function fmtCd(ms){const m=Math.floor(ms/60000);const h=Math.floor(m/60);return h>0?`${h}h ${m%60}m`:`${m}m`;}
function el(html){const wrap=document.createElement('div');wrap.innerHTML=html.trim();return wrap.firstElementChild;}
function toast(msg){document.querySelector('.skmw-toast')?.remove();const t=el(`<div class="skmw-toast">${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

// ==== sample data (mirrors real rows) ====
let calState = {
  tab: 'upcoming',
  posts: [
    { id: 13, status: 'pending', community_slug: 'ai-pays-my-bills-7018', community_url: 'https://www.skool.com/ai-pays-my-bills-7018',
      content: 'Just testing, ignore me\n\nMade an account here to check how the posts look with formatting, links and everything else.',
      scheduled_for: new Date(Date.now() + 3600e3).toISOString(), media_url: null, gif_search: null },
    { id: 14, status: 'pending', community_slug: 'ai-pays-my-bills-7018', community_url: 'https://www.skool.com/ai-pays-my-bills-7018',
      content: 'Automated E2E: GIF capture with native picker — checking the green notice and the exact re-attach.',
      scheduled_for: new Date(Date.now() + 26 * 3600e3).toISOString(),
      media_url: 'https://media0.giphy.com/media/Tz30IjVH9wFich4MLO/giphy.gif', gif_search: 'money' },
    { id: 12, status: 'published', community_slug: 'ai-pays-my-bills-7018', community_url: 'https://www.skool.com/ai-pays-my-bills-7018',
      content: 'TEST dropped GIF — published with the exact chosen media.',
      scheduled_for: new Date(Date.now() - 3600e3).toISOString(), published_url: 'https://www.skool.com/ai-pays-my-bills-7018/x' },
  ],
};

// ==== popup skeleton (renderCalendar verbatim minus chrome.*) ====
function renderCalendar() {
  document.querySelector('.skmw-pop')?.remove();
  const pop = el(`<div class="skmw-pop">
    <div class="skmw-pop-h"><h3>📅 Scheduled posts</h3><span style="display:inline-flex;align-items:center;"><label class="skmw-ac" title="Keep only the 5 newest Sent posts (and none older than 7 days)">🧹<input type="checkbox" id="skmw-ac">auto-clean</label><button class="skmw-pop-x">✕</button></span></div>
    <div class="skmw-tabs">
      <div class="skmw-tab" data-tab="upcoming">Upcoming</div>
      <div class="skmw-tab" data-tab="published">Sent</div>
      <div class="skmw-tab" data-tab="failed">Failed</div>
    </div>
    <div id="skmw-list"></div>
  </div>`);
  document.body.appendChild(pop);
  pop.querySelector('.skmw-pop-x').addEventListener('click', () => pop.remove());
  pop.querySelectorAll('.skmw-tab').forEach((t) => t.addEventListener('click', () => {
    calState.tab = t.dataset.tab; renderCalendar();
  }));
  pop.querySelector(`.skmw-tab[data-tab="${calState.tab}"]`)?.classList.add('active');
  makeDraggable(pop, 'skmw_pos_pop');
  renderList();
}
function makeDraggable(pop, storageKey) {
  const h = pop.querySelector('.skmw-pop-h');
  if (!h) return;
  const clamp = (x, y, r) => ({ x: Math.max(8, Math.min(x, innerWidth - r.width - 8)), y: Math.max(48, Math.min(y, innerHeight - 48)) });
  h.addEventListener('mousedown', (e) => {
    if (e.target.closest('button, input, textarea, select, a, label')) return;
    e.preventDefault();
    const r = pop.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    pop.style.transform = 'none';
    const move = (ev) => { const c = clamp(ev.clientX - dx, ev.clientY - dy, r); pop.style.left = c.x + 'px'; pop.style.top = c.y + 'px'; };
    const up = () => {
      removeEventListener('mousemove', move, true); removeEventListener('mouseup', up, true);
      const c = clamp(parseFloat(pop.style.left) || r.left, parseFloat(pop.style.top) || r.top, r);
      localStorage.setItem(storageKey, JSON.stringify({ x: c.x, y: c.y }));
    };
    addEventListener('mousemove', move, true); addEventListener('mouseup', up, true);
  });
  const p = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if (p) { requestAnimationFrame(() => { pop.style.transform = 'none'; pop.style.left = p.x + 'px'; pop.style.top = p.y + 'px'; }); }
}

// ==== list (renderList verbatim; delete + api stubbed) ====
function renderList() {
  const list = document.getElementById('skmw-list');
  if (!list) return;
  document.querySelector('.skmw-pop')?.classList.remove('editing');
  const now = Date.now();
  const byTab = (p) => {
    const st = p.status || 'pending';
    if (calState.tab === 'published') return st === 'published';
    if (calState.tab === 'failed') return st === 'failed';
    return st === 'pending';
  };
  const items = calState.posts.filter(byTab).sort((a, b) =>
    calState.tab !== 'upcoming'
      ? new Date(b.published_at || b.scheduled_for) - new Date(a.published_at || a.scheduled_for)
      : new Date(a.scheduled_for) - new Date(b.scheduled_for));
  if (!items.length) {
    list.innerHTML = `<div class="skmw-empty">Nothing here yet.<br>Click 📅 Schedule next to the composer.<br><button class="skmw-btn skmw-btn-pink skmw-empty-magic" type="button">🪄 Click here to see the magic</button></div>`;
    list.querySelector('.skmw-empty-magic')?.addEventListener('click', () => toast('(в макете — открывается Magic-диалог)'));
    return;
  }
  list.innerHTML = items.map((p) => {
    const d = new Date(p.scheduled_for);
    const st = p.status || 'pending';
    const cls = st === 'published' ? 'skmw-published' : st === 'failed' ? 'skmw-failed' : (d.getTime() < now ? 'skmw-failed' : 'skmw-pending');
    const label = st === 'published' ? 'Sent' : st === 'failed' ? 'Failed' : (d.getTime() < now ? 'Overdue' : 'Pending');
    const grp = p.community_slug
      ? `<div class="skmw-grp"><span class="skmw-grp-ic">${escapeHtml(p.community_slug.slice(0, 1))}</span><a href="${escapeHtml(p.community_url || ('https://www.skool.com/' + p.community_slug))}" target="_blank" rel="noopener" title="Open community">${escapeHtml(p.community_slug)}</a></div>`
      : '';
    const cd = st === 'pending' ? `<span class="skmw-cd" data-ts="${d.getTime()}"></span>` : '';
    const x = `<button class="skmw-x" data-id="${p.id}" title="Delete from list">✕</button>`;
    return `<div class="skmw-item" data-id="${p.id}">
      <div class="t">${d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })} <span class="skmw-pill ${cls}">${label}</span> ${cd} ${grp} ${x}</div>
      <div class="c">${(p.content || '').slice(0, 160) || '(empty)'}</div>
    </div>`;
  }).join('');
  const tickCd = () => {
    if (!list.isConnected) { clearInterval(list._cdTimer); return; }
    list.querySelectorAll('.skmw-cd').forEach((n) => {
      const ms = parseInt(n.dataset.ts, 10) - Date.now();
      n.textContent = ms <= 0 ? '· due' : `· ${fmtCd(ms)}`;
    });
  };
  clearInterval(list._cdTimer);
  tickCd();
  list._cdTimer = setInterval(tickCd, 20000);
  list.querySelectorAll('.skmw-item').forEach((node) => {
    node.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('.skmw-x')) return;
      const post = calState.posts.find((p) => String(p.id) === node.dataset.id);
      if (!post) return;
      const st = post.status || 'pending';
      if (st === 'pending') { renderEditForm(post, list); return; }
      if (st === 'published') toast('(открылся бы published_url)');
    });
  });
  list.querySelectorAll('.skmw-x').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id, 10);
      calState.posts = calState.posts.filter((p) => p.id !== id);
      await new Promise((r) => setTimeout(r, 250)); // имитация запроса
      renderList();
      toast('🗑 Deleted');
    });
  });
}

// ==== mini calendar (renderMiniCalendar verbatim) ====
function renderMiniCalendar(container, selected, onSelect) {
  if (!container) return;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const view = new Date(selected.getFullYear(), selected.getMonth(), 1);
  const firstDow = (view.getDay() + 6) % 7;
  const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  let html = '<div class="skmw-cal-dow">Mo</div><div class="skmw-cal-dow">Tu</div><div class="skmw-cal-dow">We</div><div class="skmw-cal-dow">Th</div><div class="skmw-cal-dow">Fr</div><div class="skmw-cal-dow">Sa</div><div class="skmw-cal-dow">Su</div>';
  for (let i = 0; i < firstDow; i++) html += '<div class="skmw-cal-day muted"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const past = date < today;
    const isToday = date.getTime() === today.getTime();
    const isSel = date.getFullYear() === selected.getFullYear() && date.getMonth() === selected.getMonth() && date.getDate() === selected.getDate();
    const cls = 'skmw-cal-day' + (past ? ' past' : '') + (isToday ? ' today' : '') + (isSel ? ' selected' : '');
    html += `<div class="${cls}" data-d="${d}">${d}</div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.skmw-cal-day:not(.muted):not(.past)').forEach((node) => {
    node.addEventListener('click', () => {
      const d = parseInt(node.dataset.d);
      onSelect(new Date(view.getFullYear(), view.getMonth(), d, selected.getHours(), selected.getMinutes()));
    });
  });
}

// ==== edit form (renderEditForm verbatim; save/delete stubbed) ====
function gifDesc(u, term) {
  return u ? escapeHtml(u.slice(0, 60)) + (u.length > 60 ? '…' : '') : `search fallback “${escapeHtml(term || '')}”`;
}
function renderEditForm(post, container) {
  const content = post.content || '';
  let title = (post.title || '').trim();
  let bodyContent = content;
  if (!title && content.includes('\n')) {
    const firstLine = content.split('\n', 1)[0].trim();
    if (firstLine && firstLine.length <= 120) {
      title = firstLine;
      bodyContent = content.split('\n').slice(1).join('\n').trim();
    }
  }
  let chosen = new Date(post.scheduled_for);
  if (isNaN(chosen.getTime())) chosen = atDayOffset(1, 9, 0);
  const minDt = toDtLocal(new Date());

  container.closest('.skmw-pop')?.classList.add('editing');
  container.innerHTML = `
    <div class="skmw-edit-header">
      <button class="skmw-btn-back" id="skmw-edit-back">← Back to list</button>
      <h3>✏️ Edit scheduled post</h3>
    </div>
    <label>Title</label>
    <input type="text" id="skmw-e-title" value="${escapeHtml(title)}" placeholder="Post title">
    <label style="margin-top:14px;">Post content</label>
    <textarea id="skmw-e-content" placeholder="Write your post...">${escapeHtml(bodyContent)}</textarea>
    ${(() => { const hasGif = !!(post.media_url || post.gif_search); return `<div style="font-size:12px;${hasGif ? 'color:#166534;background:#DCFCE7;border:1.5px solid #16A34A;' : 'color:#6b7280;background:#F9FAFB;border:1.5px solid #e5e7eb;'}border-radius:8px;padding:8px 10px;margin-top:8px;">🎬 GIF: ${hasGif ? '✓ ' + gifDesc(post.media_url, post.gif_search) : '✗ none'}</div>`; })()}
    <label style="margin-top:14px;">Publish at</label>
    <input type="datetime-local" class="skmw-dt" id="skmw-e-dt" min="${minDt}" value="${toDtLocal(chosen)}">
    <div class="skmw-past-note" id="skmw-e-past">⚠️ Can't schedule in the past — pick a future time.</div>
    <div class="skmw-edit-actions">
      <button class="skmw-btn skmw-btn-ghost" id="skmw-e-delete" style="border-color:#dc2626;color:#dc2626;">🗑 Delete</button>
      <button class="skmw-btn skmw-btn-pink" id="skmw-e-save">Update</button>
    </div>
    <div class="skmw-err" id="skmw-e-err"></div>
  `;

  const $dt = document.getElementById('skmw-e-dt');
  const $past = document.getElementById('skmw-e-past');

  function syncFromChosen() {
    $dt.value = toDtLocal(chosen);
    $past.style.display = chosen.getTime() < Date.now() ? 'block' : 'none';
  }
  $dt.addEventListener('change', () => {
    const v = new Date($dt.value);
    if (!isNaN(v.getTime())) { chosen = v; syncFromChosen(); }
  });
  syncFromChosen();

  document.getElementById('skmw-edit-back').addEventListener('click', () => renderList());

  const showErr = (msg) => { const e = document.getElementById('skmw-e-err'); e.textContent = msg; e.style.display = 'block'; };
  const hideErr = () => { document.getElementById('skmw-e-err').style.display = 'none'; };

  document.getElementById('skmw-e-save').addEventListener('click', async () => {
    const v = new Date($dt.value);
    if (!isNaN(v.getTime())) chosen = v;
    const finalContent = document.getElementById('skmw-e-content').value.trim();
    if (!finalContent) return showErr('Post content is empty.');
    const titleVal = document.getElementById('skmw-e-title').value.trim();
    if (!titleVal) return showErr('Post title is empty.');
    if (chosen.getTime() < Date.now()) return showErr('Pick a time in the future.');
    const btn = document.getElementById('skmw-e-save');
    btn.disabled = true; btn.textContent = '⏳ Saving...';
    hideErr();
    await new Promise((r) => setTimeout(r, 400)); // имитация PUT
    post.content = finalContent; post.title = titleVal; post.scheduled_for = chosen.toISOString();
    toast('✅ Post updated');
    await new Promise((r) => setTimeout(r, 100));
    renderList();
  });
  document.getElementById('skmw-e-delete').addEventListener('click', async () => {
    calState.posts = calState.posts.filter((p) => p.id !== post.id);
    toast('🗑 Deleted');
    renderList();
  });
}

// ==== 📅 Schedule post (create) — replica of openScheduleDialog(!isEdit) ====
function atToday(h, m) { const d = new Date(); d.setHours(h, m, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); return d; }
function openScheduleMock() {
  document.querySelector('.skmw-overlay')?.remove();
  // Composer state sample: title input + editor body + captured GIF.
  const composerTitle = 'How I made my first $1000 with AI';
  const composerBody = 'Just testing, ignore me — this is the body from the Skool composer with\n\nparagraph breaks preserved exactly as editorText returns them.';
  const composerGif = 'https://media0.giphy.com/media/Tz30IjVH9wFich4MLO/giphy.gif';
  let chosen = atDayOffset(1, 9, 0);
  const minDt = toDtLocal(new Date());
  const overlay = el(`<div class="skmw-overlay"></div>`);
  const modal = el(`<div class="skmw-modal skmw-modal-wide">
    <h2>📅 Schedule post</h2>
    <p class="sub">Publishes automatically at the chosen time — as you, in this community.</p>
    <div class="skmw-notice" style="background:#DCFCE7;border:1.5px solid #16A34A;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#166534;"><strong>🎬 GIF will be saved:</strong> the GIF from the composer is stored with the scheduled post and re-attached when it publishes (a matching GIF search is kept as backup).</div>
    <div class="skmw-sched-cols">
      <div class="skmw-sched-left">
        <label>Title</label>
        <input type="text" id="skmw-s-title" value="${escapeHtml(composerTitle)}" placeholder="Post title">
        <label style="margin-top:14px;">Post content</label>
        <textarea id="skmw-s-content" placeholder="Write your post...">${escapeHtml(composerBody)}</textarea>
      </div>
      <div class="skmw-sched-right">
        <h4>Quick schedule</h4>
        <div class="skmw-presets" id="skmw-s-presets"></div>
        <label style="margin-top:16px;">Publish at <span style="text-transform:none;font-weight:400;color:#9ca3af;">(editable)</span></label>
        <input type="datetime-local" class="skmw-dt" id="skmw-s-dt" min="${minDt}" value="${toDtLocal(chosen)}">
        <div class="skmw-past-note" id="skmw-s-past">⚠️ Can't schedule in the past — pick a future time.</div>
        <label class="skmw-row" style="margin-top:12px;cursor:pointer;text-transform:none;font-weight:600;"><input type="checkbox" id="skmw-s-ntf" style="margin:0;" checked> 🔔 Notify when it goes out</label>
    </div>
    <div class="skmw-actions">
      <button class="skmw-btn skmw-btn-ghost" id="skmw-s-cancel">Cancel</button>
      <button class="skmw-btn skmw-btn-pink" id="skmw-s-save">📅 Schedule</button>
    </div>
    <div class="skmw-err" id="skmw-s-err"></div>
  `);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  const close = () => overlay.remove();
  const $dt = document.getElementById('skmw-s-dt');
  const $past = document.getElementById('skmw-s-past');
  function syncFromChosen() {
    $dt.value = toDtLocal(chosen);
    $past.style.display = chosen.getTime() < Date.now() ? 'block' : 'none';
  }
  $dt.addEventListener('change', () => {
    const v = new Date($dt.value);
    if (!isNaN(v.getTime())) { chosen = v; syncFromChosen(); }
  });
  syncFromChosen();
  const presets = [
    { label: '⚡ In 1 hour', at: () => new Date(Date.now() + 3600 * 1000) },
    { label: '🌅 Today 18:00', at: () => atToday(18, 0) },
    { label: '☀️ Tomorrow 9:00', at: () => atDayOffset(1, 9, 0) },
    { label: '📆 Tomorrow 12:00', at: () => atDayOffset(1, 12, 0) },
    { label: '🌙 Tomorrow 18:00', at: () => atDayOffset(1, 18, 0) },
    { label: '➕ In 1 week', at: () => new Date(Date.now() + 7 * 24 * 3600 * 1000) },
    { label: '🌆 Today 21:00', at: () => atToday(21, 0) },
    { label: '📅 Monday 9:00', at: () => { const d = new Date(); d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7)); d.setHours(9, 0, 0, 0); return d; } },
  ];
  const $presets = document.getElementById('skmw-s-presets');
  presets.forEach((p) => {
    const b = el(`<button class="skmw-preset" type="button">${p.label}</button>`);
    b.addEventListener('click', () => { chosen = p.at(); syncFromChosen(); });
    $presets.appendChild(b);
  });
  const showErr = (msg) => { const e = document.getElementById('skmw-s-err'); e.textContent = msg; e.style.display = 'block'; };
  const hideErr = () => { document.getElementById('skmw-s-err').style.display = 'none'; };
  document.getElementById('skmw-s-cancel').addEventListener('click', close);
  document.getElementById('skmw-s-save').addEventListener('click', async () => {
    const v = new Date($dt.value);
    if (!isNaN(v.getTime())) chosen = v;
    const titleVal = document.getElementById('skmw-s-title').value.trim();
    if (!titleVal) return showErr('Post title is empty.');
    if (chosen.getTime() < Date.now()) return showErr('Pick a time in the future.');
    const btn = document.getElementById('skmw-s-save');
    btn.disabled = true; btn.textContent = '⏳ Saving...';
    hideErr();
    await new Promise((r) => setTimeout(r, 400)); // имитация POST
    const finalContent = document.getElementById('skmw-s-content').value.trim();
    calState.posts.unshift({ id: Date.now(), status: 'pending', community_slug: 'ai-pays-my-bills-7018', community_url: 'https://www.skool.com/ai-pays-my-bills-7018', content: finalContent, title: titleVal, scheduled_for: chosen.toISOString(), media_url: composerGif, gif_search: null });
    close();
    toast('✅ Post scheduled');
    renderCalendar();
  });
}
renderCalendar();
</script>
